<div
  class="langa-page-loader"
  [class.langa-page-loader--viewport]="fullViewport()"
  [class.langa-page-loader--section]="!fullViewport()"
  role="status"
  [attr.aria-live]="'polite'"
  [attr.aria-label]="currentMessage()"
>
  <div class="langa-page-loader__animation" aria-hidden="true">
    <div class="langa-page-loader__lights">
      @for (light of lights; track light) {
        <span class="langa-page-loader__light" [style.animation-delay.ms]="light * 180"></span>
      }
    </div>
    <div class="langa-page-loader__stripe"></div>
  </div>

  <p class="langa-page-loader__message">{{ currentMessage() }}</p>
</div>
