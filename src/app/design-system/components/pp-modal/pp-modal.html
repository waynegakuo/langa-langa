@if (open()) {
  <div
    class="pp-modal"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="ariaLabel() || title() || null"
  >
    <button
      type="button"
      class="pp-modal__backdrop"
      aria-label="Close dialog"
      (click)="onBackdropClick()"
    ></button>

    <div class="pp-modal__panel">
      @if (title()) {
        <header class="pp-modal__header">
          <span class="pp-modal__title">{{ title() }}</span>
          <button
            type="button"
            class="pp-modal__close"
            aria-label="Close"
            (click)="closed.emit()"
          >
            <span aria-hidden="true">&times;</span>
          </button>
        </header>
      }

      <div class="pp-modal__body">
        <ng-content />
      </div>
    </div>
  </div>
}
