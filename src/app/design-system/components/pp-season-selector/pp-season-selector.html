<div class="pp-season-selector" #root>
  <span class="pp-season-selector__label" id="pp-season-selector-label">Season</span>

  <div class="pp-season-selector__dropdown">
    <button
      type="button"
      class="pp-season-selector__trigger"
      [class.pp-season-selector__trigger--open]="open()"
      [attr.aria-expanded]="open()"
      aria-haspopup="listbox"
      aria-labelledby="pp-season-selector-label pp-season-selector-value"
      aria-controls="pp-season-selector-listbox"
      (click)="toggle()"
    >
      <span id="pp-season-selector-value" class="pp-season-selector__value">
        {{ season.selectedYear() }}
      </span>
      <span class="pp-season-selector__chevron" aria-hidden="true"></span>
    </button>

    @if (open()) {
      <ul
        id="pp-season-selector-listbox"
        class="pp-season-selector__menu"
        role="listbox"
        aria-labelledby="pp-season-selector-label"
      >
        @for (year of season.availableSeasons; track year) {
          <li role="presentation">
            <button
              type="button"
              role="option"
              class="pp-season-selector__option"
              [class.pp-season-selector__option--active]="season.selectedYear() === year"
              [attr.aria-selected]="season.selectedYear() === year"
              (click)="selectYear(year)"
            >
              {{ year }}
            </button>
          </li>
        }
      </ul>
    }
  </div>
</div>
